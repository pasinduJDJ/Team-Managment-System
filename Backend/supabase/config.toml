# Local Supabase project identifier only.
# The remote project is selected later with:
#   npx supabase link --project-ref YOUR_PROJECT_REF
project_id = "bmv-old-boys-digital-diary"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/**"]
enable_signup = false

[functions.admin-api]
verify_jwt = true

[functions.google-form-intake]
# This webhook is authenticated by x-webhook-secret inside the function.
verify_jwt = false

[functions.health]
# Health exposes no personal data or secret values.
verify_jwt = false
